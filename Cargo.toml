[package]
name = "embassy"
version = "0.1.0"
edition = "2024"

[dependencies]
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.5"
embassy-executor = { version = "0.9.1", features = [
    "arch-cortex-m",
    "executor-thread",
    "executor-interrupt",
    "defmt",
] }
embassy-stm32 = { version = "0.5.0", features = [
    "stm32u545re",
    "memory-x",
    "time-driver-any",
    "exti",
    "unstable-pac",
] }
embassy-time = "0.5.0"
embassy-futures = "0.1.2"
mipidsi = "0.9.0"
embedded-graphics = "0.8.1"
embedded-hal = "0.2.7"
embedded-hal-bus = "0.2.0"
embedded-sdmmc = "0.6.0"
# static_cell = "2.1.0"
embassy-sync = { version = "0.7.0", features = ["defmt"] }
defmt = "0.3"
defmt-rtt = "0.4"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }
heapless = "0.8.0"
tinybmp = "0.7.0"
